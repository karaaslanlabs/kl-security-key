name: Publication hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepublish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and pinned submodule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Run publication gate
        run: ./scripts/prepublish-check.sh
