name: Bug report
description: Report a reproducible KL Security Key engineering issue
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private keys, PINs, credential databases, account data, or secret-bearing flash images. Security vulnerabilities must follow SECURITY.md instead of a public issue.
  - type: input
    id: revision
    attributes:
      label: Repository revision
      description: Commit SHA or branch used for the test.
      placeholder: e.g. e6e6fc9
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware / environment
      description: Board, OS, browser/client and relevant relying party.
      placeholder: RP2040 board, Windows 11, browser/client...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: State what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Build...
        2. Register...
        3. Authenticate...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs or observations with secrets and account identifiers removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Security check
      options:
        - label: I confirmed this report contains no secrets or credential material.
          required: true
